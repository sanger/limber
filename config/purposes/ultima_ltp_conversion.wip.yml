---
# Takes the wells with conversion requests of up to 10 Illumina library plates
# (XP plates or Library Stock Plates). Other active requests on the wells,
# e.g. pending Illumina multiplexing, are ignored (request_type_keys).
# Normalisation is done outside LIMS for the MVP, so TenStamp records one
# volume for all wells.
ULTP DNA Norm:
  :asset_type: plate
  :creator_class:
    name: LabwareCreators::TenStamp
    args:
      acceptable_purposes:
        - LB Lib PCR-XP
        - LTN Lib PCR XP
        - RVI Lib PCR XP
        - RVIG Lib PCR XP
        - LBB Lib PCR-XP
        - LBB Lib PCR-XP Norm
        - Library Stock Plate
      request_type_keys:
        - limber_ultima_ltp_conversion
  :presenter_class: Presenters::UltimaConversionPresenter
  :tag_group_adapter_type_name_filter: 'Ultima'
  # 10x Flex v2: UG-RD-1928 is for UG100, UG-RD-1929 for UG200. The tagging
  # page cannot tell the sequencer, so it offers both.
  :allowed_tag_sets_by_application:
    '10x Flex v2':
      - UG-RD-1928
      - UG-RD-1929
  :file_links:
    - name: Download Tag Transfer Picklist
      id: tag_transfer_picklist
      states:
        - processed_2
ULTP PCR XP:
  :asset_type: plate
  :default_printer_type: :plate_xp2
ULTP Lib Norm:
  :asset_type: plate
ULTP Lib Pool Norm:
  :asset_type: tube
  :target: MultiplexedLibraryTube
  :type: IlluminaHtp::MxTubePurpose
  :creator_class: LabwareCreators::FinalTubeFromPlate
  :presenter_class: Presenters::FinalTubePresenter
  :default_printer_type: :ultima_balanced_norm_tube
